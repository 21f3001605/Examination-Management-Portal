{% extends 'base.html' %}
{% block content %}
<div class="col-md-6 mx-auto">
  <h3>{{ 'Edit Slot' if slot else 'Create Slot' }}</h3>
  <p class="text-muted">{{ exam.name }} ({{ exam.course.code }}) · {{ exam.duration_min }} min per student</p>
  <form method="POST">
    <label class="form-label">Date</label>
    <input class="form-control mb-2" type="date" name="date" value="{{ slot.date if slot else '' }}" required>
    <label class="form-label">Start time</label>
    <input class="form-control mb-2" type="time" name="start_time" value="{{ slot.start_time.strftime('%H:%M') if slot else '' }}" required>
    <label class="form-label">End time</label>
    <input class="form-control mb-2" type="time" name="end_time" value="{{ slot.end_time.strftime('%H:%M') if slot else '' }}" required>
    <label class="form-label">Maximum students</label>
    <input class="form-control mb-3" type="number" min="1" name="capacity" value="{{ slot.capacity if slot else '' }}" required>
    <button class="btn btn-dark">{{ 'Update' if slot else 'Create' }}</button>
    <a href="{{ url_for('examiner.slots') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
