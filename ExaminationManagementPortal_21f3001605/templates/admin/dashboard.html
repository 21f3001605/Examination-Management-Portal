{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Admin Dashboard</h2>
<div class="row">
  {% for label, count in stats.items() %}
  <div class="col-md-4 mb-3">
    <div class="card text-center">
      <div class="card-body">
        <h1>{{ count }}</h1>
        <p class="text-muted mb-0">{{ label }}</p>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
